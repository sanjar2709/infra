---
- name: Check that a public key is set
  ansible.builtin.assert:
    that: deploy_ssh_public_key | length > 0
    fail_msg: Set deploy_ssh_public_key in group_vars/all.yml, otherwise you lock yourself out

- name: Create the deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: sudo
    append: true

# The CI key, if there is one, can only run deploy-app: no shell, no forwarding, no sudo
- name: Add the SSH keys
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: |
      {{ deploy_ssh_public_key }}
      {% if deploy_ci_ssh_public_key %}
      restrict,command="/usr/local/bin/deploy-app" {{ deploy_ci_ssh_public_key }}
      {% endif %}
    exclusive: true

- name: Allow sudo without a password for the deploy user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ deploy_user }}"
    content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s
