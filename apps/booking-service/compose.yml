name: booking-service

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10

  web:
    image: ghcr.io/sanjar2709/booking-service:${TAG:-latest}
    restart: unless-stopped
    command: sh -c "alembic upgrade head && gunicorn main:app --worker-class uvicorn_worker.UvicornWorker --workers 2 --bind 0.0.0.0:8000"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.booking-service.rule=Host(`booking.${DOMAIN}`)
      - traefik.http.services.booking-service.loadbalancer.server.port=8000

volumes:
  postgres_data:

networks:
  internal:
  proxy:
    external: true
